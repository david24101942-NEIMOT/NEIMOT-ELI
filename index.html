<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TIAMO MUSIC</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

  <style>
    body {
      min-height: 100vh;
      background: #111 url('REKA.jpeg') no-repeat center center fixed;
      background-size: contain;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 15px 120px 15px;
      position: relative;
      font-family: Arial, sans-serif;
    }
  
    body::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 0;
    }
  
    header, .grid-container, footer, .modal {
      position: relative;
      z-index: 1;
    }
  
    header {
      text-align: center;
      margin-bottom: 30px;
      margin-top: 10px;
    }
  
    h1 {
      font-size: 2.8rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-shadow: 0 4px 15px rgba(0,0,0,0.5);
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 1rem;
      color: #e0e0e0;
      text-shadow: 0 2px 8px rgba(0,0,0,0.6);
      margin-bottom: 15px;
      line-height: 1.5;
    }
  
    .admin-btn {
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: #fff;
      padding: 8px 18px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.95rem;
      transition: all 0.3s ease;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
  
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 1000px;
    }
  
    .card {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 16px;
      padding: 20px 15px;
      text-align: center;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
  
    .card.active {
      border-color: #2ecc71;
      box-shadow: 0 0 20px rgba(46, 204, 113, 0.5);
    }
  
    .song-title {
      font-size: 1.15rem;
      font-weight: 500;
      margin-bottom: 15px;
      text-shadow: 0 2px 5px rgba(0,0,0,0.4);
      word-break: break-word;
    }

    /* עיצוב אזור הלחצנים בכרטיס השיר */
    .song-buttons {
      display: flex;
      gap: 6px;
      width: 100%;
      justify-content: center;
    }
  
    .action-btn {
      flex: 1;
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 8px 5px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .action-btn:hover {
      background: rgba(255, 255, 255, 0.35);
    }

    .card.active .action-btn.play-action {
      background: #2ecc71;
      border-color: #2ecc71;
    }
  
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 100;
    }
  
    .modal-content {
      background: rgba(30, 30, 30, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      padding: 25px;
      width: 100%;
      max-width: 500px;
      color: #fff;
      max-height: 90vh;
      overflow-y: auto;
    }
  
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 10px;
    }
  
    .close-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 1.5rem;
      cursor: pointer;
    }
  
    .form-section {
      background: rgba(255, 255, 255, 0.05);
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 15px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
  
    .form-group {
      margin-bottom: 10px;
    }

    .form-group input {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 0.95rem;
      box-sizing: border-box;
    }
  
    .save-btn {
      width: 100%;
      background: #2ecc71;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 10px;
    }

    .logout-btn {
      background: #e74c3c;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
    }
  
    .admin-song-list {
      margin-top: 25px;
      border-top: 1px solid rgba(255,255,255,0.1);
      padding-top: 15px;
    }
  
    .admin-song-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.05);
      padding: 8px 12px;
      border-radius: 8px;
      margin-bottom: 8px;
    }
  
    .delete-btn {
      background: #e74c3c;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <h1>TIAMO MUSIC</h1>
    <div class="subtitle">
      נעימות אלה נוצרו ע"י AI, הזכויות ללחנים שמורות ליוצרים המקוריים!<br>
      ניהול ועריכה: אלי מזרחי
    </div>
    <button class="admin-btn" onclick="openAdminModal()"><i class="fas fa-cog"></i> ניהול שירים</button>
  </header>

  <div class="grid-container" id="songsContainer"></div>

  <!-- Modal Login / Admin Panel -->
  <div class="modal" id="adminModal">
    <div class="modal-content">
      
      <!-- חלון התחברות -->
