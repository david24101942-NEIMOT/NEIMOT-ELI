<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TIAMO MUSIC</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <style>
    body {
      min-height: 100vh;
      background: #111 url('REKA.jpeg') no-repeat center center fixed;
      background-size: contain;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 15px 120px 15px;
      position: relative;
      font-family: Arial, sans-serif;
    }
  
    body::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 0;
    }
  
    header, .grid-container, footer, .modal {
      position: relative;
      z-index: 1;
    }
  
    header {
      text-align: center;
      margin-bottom: 35px;
      margin-top: 15px;
    }
  
    h1 {
      font-size: 2.8rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-shadow: 0 4px 15px rgba(0,0,0,0.5);
      margin-bottom: 12px;
    }

    .sub-credits {
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.85);
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
      margin-bottom: 20px;
      font-weight: 400;
      letter-spacing: 0.5px;
    }
  
    .admin-btn {
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: #fff;
      padding: 8px 18px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.95rem;
      transition: all 0.3s ease;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
  
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 1000px;
    }
  
    .card {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 16px;
      padding: 20px 15px;
      text-align: center;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      position: relative;
    }
  
    .card.active {
      border-color: #2ecc71;
      box-shadow: 0 0 20px rgba(46, 204, 113, 0.5);
    }
  
    .song-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      margin-bottom: 12px;
    }

    .song-title {
      font-size: 1.1rem;
      font-weight: 500;
      text-shadow: 0 2px 5px rgba(0,0,0,0.4);
      word-break: break-word;
      text-align: right;
      flex-grow: 1;
    }

    /* עיצוב לחצני החיצים להזזה אישית */
    .move-btns {
      display: flex;
      gap: 4px;
    }

    .move-btn {
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      font-size: 0.75rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .move-btn:hover {
      background: rgba(255, 255, 255, 0.4);
    }

    .seek-slider {
      width: 90%;
      margin: 10px 0;
      accent-color: #2ecc71;
      cursor: pointer;
      height: 6px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.3);
      appearance: none;
      -webkit-appearance: none;
    }

    .seek-slider::-webkit-slider-thumb {
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #ffffff;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
    }

    .controls-group {
      display: flex;
      gap: 8px;
      width: 100%;
      justify-content: center;
      margin-top: 8px;
    }
  
    .action-btn {
      background: rgba(255, 255, 255, 0.2);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.4);
      padding: 8px 14px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 5px;
      box-shadow: 0 4px 10px
