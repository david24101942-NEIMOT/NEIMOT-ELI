<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TIAMO MUSIC</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <style>
    body {
      min-height: 100vh;
      background: #111 url('REKA.jpeg') no-repeat center center fixed;
      background-size: contain;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 15px 120px 15px;
      position: relative;
      font-family: Arial, sans-serif;
    }
  
    body::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 0;
    }
  
    header, .grid-container, footer, .modal {
      position: relative;
      z-index: 1;
    }
  
    header {
      text-align: center;
      margin-bottom: 35px;
      margin-top: 15px;
    }
  
    h1 {
      font-size: 2.8rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-shadow: 0 4px 15px rgba(0,0,0,0.5);
      margin-bottom: 12px;
    }

    .sub-credits {
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.85);
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
      margin-bottom: 20px;
      font-weight: 400;
      letter-spacing: 0.5px;
    }
  
    .admin-btn {
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: #fff;
      padding: 8px 18px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.95rem;
      transition: all 0.3s ease;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
  
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 1000px;
    }
  
    .card {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 16px;
      padding: 20px 15px;
      text-align: center;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      position: relative;
    }
  
    .card.active {
      border-color: #2ecc71;
      box-shadow: 0 0 20px rgba(46, 204, 113, 0.5);
    }
  
    .song-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      margin-bottom: 12px;
    }

    .song-title {
      font-size: 1.1rem;
      font-weight: 500;
      text-shadow: 0 2px 5px rgba(0,0,0,0.4);
      word-break: break-word;
      text-align: right;
      flex-grow: 1;
    }

    /* עיצוב לחצני החיצים להזזה אישית */
    .move-btns {
      display: flex;
      gap: 4px;
    }

    .move-btn {
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      font-size: 0.75rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .move-btn:hover {
      background: rgba(255, 255, 255, 0.4);
    }

    .seek-slider {
      width: 90%;
      margin: 10px 0;
      accent-color: #2ecc71;
      cursor: pointer;
      height: 6px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.3);
      appearance: none;
      -webkit-appearance: none;
    }

    .seek-slider::-webkit-slider-thumb {
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #ffffff;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
    }

    .controls-group {
      display: flex;
      gap: 8px;
      width: 100%;
      justify-content: center;
      margin-top: 8px;
    }
  
    .action-btn {
      background: rgba(255, 255, 255, 0.2);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.4);
      padding: 8px 14px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 5px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .action-btn:hover {
      background: rgba(255, 255, 255, 0.4);
    }

    .action-btn.play-active {
      background: #2ecc71;
      border-color: #2ecc71;
      color: #fff;
    }
  
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 100;
    }
  
    .modal-content {
      background: rgba(30, 30, 30, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      padding: 25px;
      width: 100%;
      max-width: 500px;
      color: #fff;
      max-height: 90vh;
      overflow-y: auto;
    }
  
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 10px;
    }
  
    .close-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 1.5rem;
      cursor: pointer;
    }
  
    .form-section {
      background: rgba(255, 255, 255, 0.05);
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 15px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
  
    .form-group input[type="text"] {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 0.95rem;
      box-sizing: border-box;
    }
  
    .save-btn {
      width: 100%;
      background: #2ecc71;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 10px;
    }
  
    .admin-song-list {
      margin-top: 25px;
      border-top: 1px solid rgba(255,255,255,0.1);
      padding-top: 15px;
    }
  
    .admin-song-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.05);
      padding: 8px 12px;
      border-radius: 8px;
      margin-bottom: 8px;
    }
  
    .delete-btn {
      background: #e74c3c;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <h1>🎼 TIAMO MUSIC 🎻</h1>
    <div class="sub-credits">כל הזכויות שמורות ליוצרי הלחנים המקוריים בלבד ! נוצר בעזרת Ai , עריכה ועיצוב - אלי מזרחי</div>
    <button class="admin-btn" onclick="checkAdminPassword()"><i class="fas fa-cog"></i> ניהול שירים</button>
  </header>

  <div class="grid-container" id="songsContainer"></div>

  <!-- Modal Admin Panel -->
  <div class="modal" id="adminModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>ניהול שירים</h3>
        <button class="close-btn" onclick="closeAdmin()">&times;</button>
      </div>

      <div class="form-section">
        <h4>הוספת שיר אוטומטית בענן</h4>
        <div class="form-group">
          <input type="text" id="songUrlInput" placeholder="הדבק כאן את הקישור מ-GitHub...">
        </div>
        <button class="save-btn" onclick="addSongAutomatic()">הוסף שיר</button>
      </div>

      <div class="admin-song-list">
        <h4>שירים קיימים במערכת</h4>
        <div id="adminSongList"></div>
      </div>
    </div>
  </div>

  <audio id="audioPlayer"></audio>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBlApQsdFF5iIrcswhtn_jSATvwYUJiz4U",
      authDomain: "neimot-eli.firebaseapp.com",
      projectId: "neimot-eli",
      storageBucket: "neimot-eli.appspot.com",
      messagingSenderId: "1098881478531",
      appId: "1:1098881478531:web:e91c6acsb1872d56ea78b6"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let songs = [];
    let currentAudio = document.getElementById('audioPlayer');
    let currentPlayingIndex = null;

    const ADMIN_ENCODED = "VEFMSTIwMjY=";

    db.collection("songs").orderBy("createdAt", "asc").onSnapshot((snapshot) => {
      let serverSongs = [];
      snapshot.forEach((doc) => {
        serverSongs.push({ id: doc.id, ...doc.data() });
      });

      // בדיקה האם למאזין יש סדר אישי שמור במכשיר שלו
      let savedOrder = localStorage.getItem('tiamo_user_song_order');
      if (savedOrder) {
        try {
          let orderIds = JSON.parse(savedOrder);
          songs = [];
          orderIds.forEach(id => {
            let found = serverSongs.find(s => s.id === id);
            if (found) songs.push(found);
          });
          serverSongs.forEach(s => {
            if (!songs.some(existing => existing.id === s.id)) {
              songs.push(s);
            }
          });
        } catch (e) {
          songs = serverSongs;
        }
      } else {
        songs = serverSongs;
      }

      renderSongs();
      renderAdminList();
    });

    function renderSongs() {
      const container = document.getElementById('songsContainer');
      container.innerHTML = '';
      songs.forEach((song, index) => {
        const isPlaying = currentPlayingIndex === index && !currentAudio.paused;
        const card = document.createElement('div');
        card.className = `card ${isPlaying ? 'active' : ''}`;
        
        card.innerHTML = `
          <div class="song-header">
            <div class="song-title">${song.name}</div>
            <div class="move-btns">
              <button class="move-btn" onclick="moveSong(${index}, -1)" title="העבר קדימה"><i class="fas fa-arrow-right"></i></button>
              <button class="move-btn" onclick="moveSong(${index}, 1)" title="העבר אחורה"><i class="fas fa-arrow-left"></i></button>
            </div>
          </div>
          <input type="range" class="seek-slider" id="slider-${index}" value="0" max="100" oninput="seekAudio(this, ${index})">
          <div class="controls-group">
            <button class="action-btn ${isPlaying ? 'play-active' : ''}" onclick="playSong(${index})" title="הפעלה">
              <i class="fas fa-play"></i>
            </button>
            <button class="action-btn" onclick="pauseSong()" title="הקפאה">
              <i class="fas fa-pause"></i>
            </button>
            <button class="action-btn" onclick="stopSong()" title="עצירה">
              <i class="fas fa-stop"></i>
            </button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // פונקציה להזזת מיקום השיר עבור המאזין ושמירה במכשיר
    function moveSong(index, direction) {
      const newIndex = index + direction;
      if (newIndex < 0 || newIndex >= songs.length) return;

      // החלפת מיקומים במערך המקומי
      const temp = songs[index];
      songs[index] = songs[newIndex];
      songs[newIndex] = temp;

      // שמירת הסדר החדש בזיכרון המקומי של המאזין
      const orderIds = songs.map(s => s.id);
      localStorage.setItem('tiamo_user_song_order', JSON.stringify(orderIds));

      renderSongs();
    }

    function playSong(index) {
      if (currentPlayingIndex !== index) {
        currentAudio.src = songs[index].url;
        currentPlayingIndex = index;
      }
      currentAudio.play();
      renderSongs();
    }

    function pauseSong() {
      currentAudio.pause();
      renderSongs();
    }

    function stopSong() {
      currentAudio.pause();
      currentAudio.currentTime = 0;
      if (currentPlayingIndex !== null) {
        let slider = document.getElementById(`slider-${currentPlayingIndex}`);
        if (slider) slider.value = 0;
      }
      currentPlayingIndex = null;
      renderSongs();
    }

    currentAudio.addEventListener('timeupdate', () => {
      if (currentPlayingIndex !== null && currentAudio.duration) {
        let slider = document.getElementById(`slider-${currentPlayingIndex}`);
        if (slider) {
          slider.max = currentAudio.duration;
          slider.value = currentAudio.currentTime;
        }
      }
    });

    function seekAudio(slider, index) {
      if (currentPlayingIndex === index) {
        currentAudio.currentTime = slider.value;
      } else {
        currentAudio.src = songs[index].url;
        currentPlayingIndex = index;
        currentAudio.currentTime = slider.value;
        currentAudio.play();
        renderSongs();
      }
    }

    // מעבר אוטומטי לנעימה הבאה ברצף בסיום הנוכחית
    currentAudio.addEventListener('ended', () => {
      if (currentPlayingIndex !== null) {
        let slider = document.getElementById(`slider-${currentPlayingIndex}`);
        if (slider) slider.value = 0;
        
        let nextIndex = currentPlayingIndex + 1;
        if (nextIndex < songs.length) {
          playSong(nextIndex); // מעבר לנעימה הבאה ברצף לפי הסדר העדכני במסך
        } else {
          currentPlayingIndex = null;
          renderSongs();
        }
      }
    });

    function checkAdminPassword() {
      let password = prompt("אנא הזן סיסמת ניהול:");
      if (password === null) return;
      
      if (btoa(password.trim()) === ADMIN_ENCODED) {
        openAdmin();
      } else {
        alert("סיסמה שגויה!");
      }
    }

    function openAdmin() {
      document.getElementById('adminModal').style.display = 'flex';
      renderAdminList();
    }

    function closeAdmin() {
      document.getElementById('adminModal').style.display = 'none';
    }

    async function addSongAutomatic() {
      let inputUrl = document.getElementById('songUrlInput').value.trim();
      if (!inputUrl) {
        alert('אנא הדבק קישור');
        return;
      }

      let rawUrl = inputUrl
        .replace('github.com', 'raw.githubusercontent.com')
        .replace('/blob/', '/');

      let parts = rawUrl.split('/');
      let encodedFileName = parts[parts.length - 1];
      let decodedFileName = decodeURIComponent(encodedFileName);
      let cleanSongName = decodedFileName.replace(/\.mp3$/i, '');

      await db.collection("songs").add({
        name: cleanSongName,
        url: rawUrl,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });

      document.getElementById('songUrlInput').value = '';
      alert(`השיר "${cleanSongName}" נוסף בהצלחה ויתעדכן מיידית בכל המכשירים!`);
    }

    async function deleteSong(id) {
      if (confirm("האם אתה בטוח שברצונך למחוק שיר זה?")) {
        await db.collection("songs").doc(id).delete();
      }
    }

    function renderAdminList() {
      const list = document.getElementById('adminSongList');
      list.innerHTML = '';
      songs.forEach((song) => {
        list.innerHTML += `
          <div class="admin-song-item">
            <span><b>${song.name}</b></span>
            <button class="delete-btn" onclick="deleteSong('${song.id}')">מחק</button>
          </div>
        `;
      });
    }
  </script>
</body>
</html>
